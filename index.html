<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Spirit Island Pairings</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>Spirit Island Pairings</h1>
<p>Community rankings of powerful spirit combinations</p>
</header>

<section class="controls">

<label>Filter Spirit</label>
<select id="filterSpirit"></select>

<input id="search" placeholder="Search pairings">

</section>

<section>

<h2>Top Pairings</h2>
<div id="pairings"></div>

</section>

<section class="submit">

<h2>Submit Pairing Rating</h2>

<div class="form">

<select id="spirit1"></select>
<select id="aspect1"></select>

<select id="spirit2"></select>
<select id="aspect2"></select>

<label>Strong: How strong is this pairing?</label>
<input type="range" min="1" max="10" value="5" id="strong">

<label>Game-Breaking: How much does this pairing change the rules of the game?</label>
<input type="range" min="1" max="10" value="5" id="game-breaking">

<label>Thematic: How well does this pairing mesh thematically?</label>
<input type="range" min="1" max="10" value="5" id="thematic">

<label>Fun: How fun is this pairing to play?</label>
<input type="range" min="1" max="10" value="5" id="fun">

<textarea id="reason" placeholder="Optional explanation"></textarea>

<button onclick="submitPairing()">Submit</button>

</div>

</section>

<script src="spirits.js"></script>
<script src="aspects.js"></script>
<script src="app.js"></script>

</body>
</html>
