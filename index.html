<!DOCTYPE html>
<html>

<head>

    <title>Spirit Island Pairings</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>

<body>

    <h1>Spirit Island Pairings</h1>

    <section>

        <h2>Top Pairings</h2>

        <div id="controls">

            <label>Filter by Spirit</label>
            <select id="filter-spirit">
                <option value="all">All</option>
            </select>

            <label>Sort By</label>
            <select id="sort-by">
                <option value="strong">Strong</option>
                <option value="gamebreaking">Gamebreaking</option>
                <option value="thematic">Thematic</option>
                <option value="fun">Fun</option>
                <option value="votes">Votes</option>
            </select>

            <label>
                <input type="checkbox" id="top10">
                Show Top 10 Only
            </label>

        </div>

        <div id="pairings"></div>

    </section>

    <section>

        <h2>Submit Rating</h2>

        <select id="spirit1"></select>
        <select id="aspect1"></select>

        <select id="spirit2"></select>
        <select id="aspect2"></select>

        <div class="rating">
            <label>Strong: How strong is this pairing? <span id="strong-value">5</span></label>
            <div class="slider-container">
                <input type="range" min="1" max="10" value="5" id="strong">
                <div class="tick-labels">
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
            </div>
        </div>

        <div class="rating">
            <label>Game-Breaking: How much does this pairing change the rules of the game? <span
                    id="gamebreaking-value">5</span></label>
            <div class="slider-container">
                <input type="range" min="1" max="10" value="5" id="gamebreaking">
                <div class="tick-labels">
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
            </div>
        </div>

        <div class="rating">
            <label>Thematic: How well does this pairing mesh thematically? <span id="thematic-value">5</span></label>
            <div class="slider-container">
                <input type="range" min="1" max="10" value="5" id="thematic">
                <div class="tick-labels">
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
            </div>
        </div>

        <div class="rating">
            <label>Fun: How fun is this pairing to play? <span id="fun-value">5</span></label>
            <div class="slider-container">
                <input type="range" min="1" max="10" value="5" id="fun">
                <div class="tick-labels">
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
            </div>
        </div>

        <button onclick="submitPairing()">Submit</button>

    </section>

    <script src="spirits.js"></script>
    <script src="aspects.js"></script>
    <script src="app.js"></script>

</body>

</html>
